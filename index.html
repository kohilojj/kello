<div id="unique-features">
    <div class="progress-container">
        <div id="day-progress-bar"></div>
    </div>
    <p id="day-percent">Päivästä kulunut: 0%</p>
    <p id="brain-load">Valveillaoloaika: 0h 0m</p>
</div>

<style>
    .progress-container {
        width: 80vw;
        height: 4px;
        background: #222;
        margin-top: 20px;
        border-radius: 2px;
        overflow: hidden;
    }
    #day-progress-bar {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #00ffcc, #008080);
        transition: width 1s linear;
    }
    #unique-features p {
        font-size: 12px;
        color: #666;
        margin: 5px 0;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
</style>

<script>
    function updateExtraFeatures() {
        const nyt = new Date();
        
        // 1. Päivän edistyminen prosentteina
        const sekunnitTanaan = (nyt.getHours() * 3600) + (nyt.getMinutes() * 60) + nyt.getSeconds();
        const prosentti = (sekunnitTanaan / 86400) * 100;
        document.getElementById('day-progress-bar').style.width = prosentti + "%";
        document.getElementById('day-percent').textContent = `Päivästä kulunut: ${prosentti.toFixed(4)}%`;

        // 2. Simuloidaan valveillaoloaikaa (esim. klo 07:00 alkaen)
        let heratys = new Date();
        heratys.setHours(7, 0, 0);
        let erotus = nyt - heratys;
        if (erotus < 0) erotus += 86400000; // Jos ollaan yön puolella
        
        const tunnit = Math.floor(erotus / 3600000);
        const minuutit = Math.floor((erotus % 3600000) / 60000);
        document.getElementById('brain-load').textContent = `Suorituskyky: ${tunnit}h ${minuutit}m käytetty`;
    }
    setInterval(updateExtraFeatures, 1000);
</script>
