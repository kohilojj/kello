<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#000000">
    <title>Pro Clock</title>
    <style>
        body {
            background-color: #000;
            color: #fff;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            user-select: none;
        }

        #kello {
            font-size: 22vw;
            font-variant-numeric: tabular-nums; /* Estää numeroiden hyppimisen */
            font-weight: 200;
            letter-spacing: -2px;
        }

        @media (min-width: 800px) { #kello { font-size: 150px; } }
    </style>
</head>
<body>
    <div id="kello">00:00:00</div>

    <script>
        function update() {
            const d = new Date();
            document.getElementById('kello').textContent = 
                d.getHours().toString().padStart(2, '0') + ":" +
                d.getMinutes().toString().padStart(2, '0') + ":" +
                d.getSeconds().toString().padStart(2, '0');
            requestAnimationFrame(update); // Tarkempi kuin setInterval
        }
        update();

        // Rekisteröidään offline-tila
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js');
        }
    </script>
</body>
</html>
